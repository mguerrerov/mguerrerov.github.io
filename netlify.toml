# Configuracion de despliegue en Netlify.
#
# El sitio NO esta conectado al repositorio de GitHub: se publica a mano con
# `npm run desplegar`, que construye y sube dist/ con la CLI. Un push a GitHub
# por si solo no cambia nada de lo que se ve en Netlify.
#
# Estos valores quedan por si algun dia se conecta el repositorio; mientras
# tanto solo sirven de referencia del comando y el directorio correctos.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Misma version que usa la verificacion en CI, para que un build que pasa
  # alli no falle aqui por diferencias de Node.
  NODE_VERSION = "22"
