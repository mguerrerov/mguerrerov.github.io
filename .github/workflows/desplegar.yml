name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos para publicar en Pages con el token del propio workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se empuja dos veces seguidas, cancela el despliegue anterior en curso.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El material de referencia con datos personales esta en .gitignore y no
      # deberia existir en el repositorio. Si aparece, el despliegue para aqui.
      - name: Comprobar que recursos/ no esta en el repositorio
        run: |
          if git ls-files --error-unmatch recursos > /dev/null 2>&1; then
            echo "ERROR: recursos/ esta versionado. No se despliega."
            exit 1
          fi
          echo "OK: recursos/ no esta versionado."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Verificacion de fuga sobre el resultado del build, no sobre el codigo.
      # El email profesional es el unico dato de contacto permitido y se excluye
      # de forma explicita para que el resto siga detectandose.
      - name: Comprobar que no hay datos personales en el build
        run: |
          fugas=$(grep -rniE "\+34|[0-9]{9}|@gmail|@hotmail" dist/ \
            | grep -v "marcosguerrerov27@gmail.com" || true)
          if [ -n "$fugas" ]; then
            echo "ERROR: posible dato personal en el build:"
            echo "$fugas"
            exit 1
          fi
          echo "OK: sin datos personales en dist/."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
