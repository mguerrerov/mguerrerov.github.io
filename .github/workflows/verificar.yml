name: Verificar el build

# El despliegue lo hace Netlify desde netlify.toml. Este workflow no publica
# nada: solo comprueba que el build sale y que no arrastra datos personales.
# Netlify no ejecuta estas verificaciones, asi que tienen que vivir aqui.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El material de referencia con datos personales esta en .gitignore y no
      # deberia existir en el repositorio. Si aparece, la verificacion falla.
      - name: Comprobar que recursos/ no esta en el repositorio
        run: |
          if git ls-files --error-unmatch recursos > /dev/null 2>&1; then
            echo "ERROR: recursos/ esta versionado."
            exit 1
          fi
          echo "OK: recursos/ no esta versionado."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Verificacion de fuga sobre el resultado del build, no sobre el codigo.
      #
      # Se comparan COINCIDENCIAS, no lineas. Astro minifica el HTML y lo deja
      # casi todo en un unico renglon: excluir por linea descartaria el fichero
      # entero en cuanto apareciese un valor permitido, que es justo lo que
      # pasaba antes.
      #
      # Permitidos: el email profesional, unico dato de contacto que el sitio
      # puede publicar, y el identificador del perfil publico de LinkedIn, que
      # forma parte de su URL.
      - name: Comprobar que no hay datos personales en el build
        run: |
          permitidos='^(marcosguerrerov27@gmail\.com|318683299)$'
          fugas=$(grep -rhoiE \
              "\+34[0-9]{9}|[0-9]{9}|[a-z0-9._%+-]+@(gmail|hotmail|outlook)\.[a-z.]+" \
              dist/ \
            | sort -u \
            | grep -vE "$permitidos" || true)
          if [ -n "$fugas" ]; then
            echo "ERROR: posible dato personal en el build:"
            echo "$fugas"
            exit 1
          fi
          echo "OK: sin datos personales en dist/."
