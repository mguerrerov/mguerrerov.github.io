name: Verificar el build

# El sitio lo despliega Netlify desde netlify.toml. Este workflow hace dos
# cosas que Netlify no hace:
#
#   1. Comprobar que el build sale y que no arrastra datos personales.
#   2. Publicar en GitHub Pages una redireccion hacia Netlify. GitHub no deja
#      desactivar Pages en un repositorio de usuario (devuelve 422), asi que la
#      alternativa a dejar dos copias del sitio compitiendo es servir solo el
#      puente para los enlaces antiguos.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El material de referencia con datos personales esta en .gitignore y no
      # deberia existir en el repositorio. Si aparece, la verificacion falla.
      - name: Comprobar que recursos/ no esta en el repositorio
        run: |
          if git ls-files --error-unmatch recursos > /dev/null 2>&1; then
            echo "ERROR: recursos/ esta versionado."
            exit 1
          fi
          echo "OK: recursos/ no esta versionado."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Comprueba que las diez paginas existen, que cada una declara su idioma
      # y su pareja, y que ninguna inglesa se quedo con texto español.
      - name: Verificar el sitio bilingue
        run: node scripts/verificar-i18n.mjs

      # Verificacion de fuga sobre el resultado del build, no sobre el codigo.
      #
      # Se comparan COINCIDENCIAS, no lineas. Astro minifica el HTML y lo deja
      # casi todo en un unico renglon: excluir por linea descartaria el fichero
      # entero en cuanto apareciese un valor permitido, que es justo lo que
      # pasaba antes.
      #
      # Permitidos: el email profesional, unico dato de contacto que el sitio
      # puede publicar, y el identificador del perfil publico de LinkedIn, que
      # forma parte de su URL.
      # Los PDF del CV quedan fuera de este filtro de texto, y no por comodidad:
      #
      #   1. grep no puede inspeccionar su contenido. El texto de un PDF va
      #      comprimido, asi que solo responde "Binary file matches" y no dice
      #      que ha encontrado: no aporta ninguna senal util.
      #   2. El CV se publica DELIBERADAMENTE con el telefono del autor, que es
      #      decision suya y excepcion consciente a la regla general del
      #      proyecto. Esta anotada en CLAUDE-portfolio.md.
      #
      # Lo que si se comprueba es que los unicos PDF publicados son los dos del
      # CV: cualquier otro PDF que aparezca en dist/ para la verificacion.
      - name: Comprobar que solo se publican los dos PDF del CV
        run: |
          esperados="cv-marcos-guerrero-en.pdf cv-marcos-guerrero-es.pdf"
          encontrados=$(find dist/ -name '*.pdf' -printf '%f\n' | sort | tr '\n' ' ')
          if [ "$encontrados" != "$esperados " ]; then
            echo "ERROR: los PDF publicados no son los esperados."
            echo "  esperados:   $esperados"
            echo "  encontrados: $encontrados"
            exit 1
          fi
          echo "OK: solo estan los dos PDF del CV."

      - name: Comprobar que no hay datos personales en el build
        run: |
          permitidos='^(marcosguerrerov27@gmail\.com|318683299)$'
          fugas=$(grep -rhoiE --exclude='*.pdf' \
              "\+34[0-9]{9}|[0-9]{9}|[a-z0-9._%+-]+@(gmail|hotmail|outlook)\.[a-z.]+" \
              dist/ \
            | sort -u \
            | grep -vE "$permitidos" || true)
          if [ -n "$fugas" ]; then
            echo "ERROR: posible dato personal en el build:"
            echo "$fugas"
            exit 1
          fi
          echo "OK: sin datos personales en dist/."

  redirigir:
    # Solo desde main: una rama o un pull request no deben tocar lo publicado.
    if: github.ref == 'refs/heads/main'
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Se sube redireccion/, no dist/: en Pages ya no vive el sitio.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redireccion

      - id: despliegue
        uses: actions/deploy-pages@v4
